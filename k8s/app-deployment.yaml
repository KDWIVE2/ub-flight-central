apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-central-app
  labels:
    app: flight-central
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flight-central
  template:
    metadata:
      labels:
        app: flight-central
    spec:
      containers:
        - name: flight-central
          image: 116981767400.dkr.ecr.us-east-1.amazonaws.com/flight-central:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/flight-central
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: flight-central-service
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8090
  selector:
    app: flight-central
