apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flight-central-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/ssl-passthrough: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - k8s-default-ingressn-513b9c0f63-1c7d0bc6cd50883d.elb.us-east-1.amazonaws.com
      secretName: flight-central-tls
  rules:
    - host: k8s-default-ingressn-513b9c0f63-1c7d0bc6cd50883d.elb.us-east-1.amazonaws.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flight-central-service  # Replace with your service name
                port:
                  number: 8090