server.port=8090
spring.application.name=flight-booking

# Database Connection with SSL
spring.datasource.url=jdbc:postgresql://flight-central-db.cn06ooekozzm.eu-north-1.rds.amazonaws.com:5432/flight_central?sslmode=require&ssl=true&sslfactory=org.postgresql.ssl.NonValidatingFactory
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool Settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.postgresql=TRACE
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate=INFO
