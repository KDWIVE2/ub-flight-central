apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-central
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flight-central
  template:
    metadata:
      labels:
        app: flight-central
    spec:
      containers:
        - name: flight-central
          image: 116981767400.dkr.ecr.us-east-1.amazonaws.com/myapp:latest
          ports:
            - containerPort: 9001
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/flight-central"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgres"
---
apiVersion: v1
kind: Service
metadata:
  name: flight-central-service
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 9001
  selector:
    app: flight-central